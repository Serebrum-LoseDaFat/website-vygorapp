<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: 1200px;
    height: 630px;
    display: flex;
    align-items: stretch;
    background: linear-gradient(135deg, #eaf5ef 0%, #f7f8fa 55%, #ffffff 100%);
    position: relative;
  }
  .left {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 70px 40px 70px 80px;
  }
  .logo {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    object-fit: contain;
    margin-bottom: 28px;
  }
  .eyebrow {
    font-size: 22px;
    font-weight: 700;
    color: #1f7a5c;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 14px;
  }
  h1 {
    font-size: 56px;
    font-weight: 800;
    color: #1a1d21;
    line-height: 1.12;
    margin-bottom: 22px;
  }
  .sub {
    font-size: 24px;
    color: #5b6270;
    line-height: 1.45;
    max-width: 480px;
  }
  .pills {
    display: flex;
    gap: 12px;
    margin-top: 32px;
  }
  .pill {
    background: #ffffff;
    border: 1px solid #dde1e6;
    color: #1a1d21;
    font-size: 18px;
    font-weight: 700;
    padding: 8px 18px;
    border-radius: 999px;
  }
  .right {
    width: 460px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1f7a5c;
    overflow: hidden;
  }
  .right::before {
    content: "";
    position: absolute;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0) 70%);
    top: -120px;
    right: -160px;
  }
  .phone {
    width: 260px;
    border-radius: 34px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
    position: relative;
    z-index: 1;
    border: 6px solid rgba(255,255,255,0.9);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="left">
      <img class="logo" src="https://www.vygor.app/_next/image?url=%2Fbrand%2Fvygor-logo.Iw62sJJl.png&w=192&q=75" alt="">
      <div class="eyebrow">Free Tool by Vygor</div>
      <h1>Weight Loss<br>Calculator</h1>
      <div class="sub">Find your BMR, TDEE, and daily calorie target &mdash; plus a realistic timeline to reach your goal weight.</div>
      <div class="pills">
        <div class="pill">BMR</div>
        <div class="pill">TDEE</div>
        <div class="pill">Calorie Target</div>
      </div>
    </div>
    <div class="right">
      <img class="phone" src="https://www.vygor.app/_next/image?url=%2Fapp%2Fhome.nouNS8OR.webp&w=384&q=75" alt="">
    </div>
  </div>
</body>
</html>
